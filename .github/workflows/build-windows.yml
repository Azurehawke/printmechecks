name: Build Windows app

# Every push to master that changes the app checks the version in
# printmechecks/package.json. If there is no GitHub Release for that version
# yet, this builds the Windows app and publishes release v<version> (the tag
# is created automatically). Installed copies of the app check these releases
# on startup and offer the update.
#
# To ship a change: bump "version" in printmechecks/package.json and push.
# Pushes that don't bump the version just build (no release).
# Running the workflow manually also builds without publishing.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'printmechecks/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: printmechecks
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: printmechecks/package-lock.json

      - name: Decide whether to publish
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual run: build only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$version" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $version already exists: build only. Bump the version in package.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing new release $version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Create tag ${{ steps.release.outputs.version }}
        if: steps.release.outputs.publish == 'true'
        run: |
          tag="${{ steps.release.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      - name: Build and publish release ${{ steps.release.outputs.version }}
        if: steps.release.outputs.publish == 'true'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: steps.release.outputs.publish != 'true'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: PrintMeChecks-windows-${{ steps.release.outputs.version }}
          path: |
            printmechecks/release/*.exe
            printmechecks/release/latest.yml
