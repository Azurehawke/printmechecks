name: Build Windows app

# Push a tag like v1.0.1 to build the Windows app and publish it as a GitHub
# Release. Installed copies of the app check these releases on startup and
# offer the update. Running this workflow manually only builds (no release).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: printmechecks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: printmechecks/package-lock.json
      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg"
            exit 1
          fi

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: PrintMeChecks-windows
          path: |
            printmechecks/release/*.exe
            printmechecks/release/latest.yml
