name: Build Windows app

# Every push to master that changes the app checks the version in
# printmechecks/package.json. If there is no GitHub Release for that version
# yet, this builds the Windows app and publishes release v<version> (the tag
# is created automatically). Installed copies of the app check these releases
# on startup and offer the update.
#
# To ship a change: bump "version" in printmechecks/package.json and push.
# Pushes that don't bump the version just build (no release).
# Running the workflow manually also builds without publishing.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'printmechecks/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: printmechecks
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: printmechecks/package-lock.json

      - name: Decide whether to publish
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual run: build only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release is complete when exactly one release has this tag and it
          # carries the installer and latest.yml (what installed apps read).
          releases=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$version\")]")
          count=$(echo "$releases" | jq 'length')
          complete=$(echo "$releases" | jq '[.[] | select(any(.assets[]; .name == "latest.yml") and any(.assets[]; .name | test("Setup.*\\.exe$")))] | length')
          if [ "$count" = "1" ] && [ "$complete" = "1" ]; then
            echo "Release $version already exists: build only. Bump the version in package.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $version ($count existing release(s) with this tag will be replaced)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        run: npm run dist:win

      - name: Publish release ${{ steps.release.outputs.version }}
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.version }}"
          # Remove any earlier or partial releases for this tag (keeps the tag).
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          # One call uploads everything, so there is exactly one release.
          # Creates the tag on this commit if it doesn't exist yet.
          gh release create "$tag" \
            release/PrintMeChecks-Setup-*.exe \
            release/PrintMeChecks-Setup-*.exe.blockmap \
            release/PrintMeChecks-*-portable.exe \
            release/latest.yml \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Print Me Checks $tag" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: PrintMeChecks-windows-${{ steps.release.outputs.version }}
          path: |
            printmechecks/release/*.exe
            printmechecks/release/latest.yml
